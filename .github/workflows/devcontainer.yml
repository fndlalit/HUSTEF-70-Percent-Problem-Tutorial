name: Workshop devcontainer
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check lifecycle preservation and shell syntax
        run: |
          for script in .devcontainer/*.sh; do bash -n "$script"; done
          bash .devcontainer/test-lifecycle.sh
      - name: Build workshop tools with latest AQE
        run: docker build -t hustef-workshop .devcontainer
      - name: Prepare and exercise the Linux container
        run: |
          WORKSHOP_RUNNER_UID="$(id -u)"
          WORKSHOP_RUNNER_GID="$(id -g)"
          trap 'sudo chown -R "$WORKSHOP_RUNNER_UID:$WORKSHOP_RUNNER_GID" "$PWD"' EXIT
          docker run --rm --user root \
            -v "$PWD:/workspaces/tutorial" -w /workspaces/tutorial \
            -e NEXT_TELEMETRY_DISABLED=1 hustef-workshop \
            bash -lc 'chown -R node:node /workspaces/tutorial && su node -c "bash .devcontainer/post-create.sh && bash .devcontainer/prepare-workshop.sh && node .devcontainer/verify-mcp.mjs && npm run test:coverage && npx --no-install tsc --noEmit && bash .devcontainer/smoke-app.sh"'
